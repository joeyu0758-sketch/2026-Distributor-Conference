<title>Rollout Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="site-css">
/* Layout: three pinned scroll scenes (wheel / layers / ride deck) on a paper-white Swiss grid, one orange accent, mono microcopy as texture. */
:root{
  --paper:#F2F0EB; --ink:#0B0B0B; --grain:#8A8A86; --line:rgba(11,11,11,.14);
  --chip:#E4E1DA; --glass:rgba(242,240,235,.62); --accent:#F2541B; --on-accent:#0B0B0B;
  --grain-blend:multiply;
  --f-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,3vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E0E0D; --ink:#EDEBE5; --grain:#8A8A86; --line:rgba(237,235,229,.16);
  --chip:#1D1D1B; --glass:rgba(22,22,20,.6); --accent:#F2541B; --on-accent:#0B0B0B;
  --grain-blend:screen; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E0E0D; --ink:#EDEBE5; --grain:#8A8A86; --line:rgba(237,235,229,.16);
  --chip:#1D1D1B; --glass:rgba(22,22,20,.6); --accent:#F2541B; --on-accent:#0B0B0B;
  --grain-blend:screen; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.muted{color:var(--grain)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* grain overlay */
/* sits behind the content, so it textures the paper but never the photos */
.grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.14;mix-blend-mode:var(--grain-blend)}
main{position:relative;z-index:1}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gutter) 14px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
.bar>*{pointer-events:auto}
.wordmark{font-family:var(--f-display);font-weight:800;font-stretch:70%;font-size:20px;letter-spacing:-.01em;text-transform:uppercase;text-decoration:none}
.wordmark i{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a{text-decoration:none;padding:6px 10px;border-radius:999px;background:var(--chip)}
.nav a:hover{background:var(--ink);color:var(--paper)}
.nav a:empty{display:none}

/* shared pinned scene */
.scene{position:relative}
.pin{position:sticky;top:0;height:100svh;min-height:540px;overflow:hidden}

/* ---------- 1. WHEEL ---------- */
#wheel{height:240svh}
.wheel-stage{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 38%;cursor:grab;touch-action:pan-y}
.wheel-stage.drag{cursor:grabbing}
.ring{position:absolute;left:50%;top:47%;width:0;height:0;transform-style:preserve-3d}
.ring .card{position:absolute;background-size:cover;background-position:center;border-radius:3px;
  backface-visibility:visible;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.hero-ui{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 64px) var(--gutter) var(--gutter);
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;gap:12px}
.hero-ui>*{pointer-events:auto}
.now{display:grid;gap:6px;align-content:start;width:min(200px,42vw)}
.now-img{aspect-ratio:3/2;width:100%;background-size:cover;background-position:center;border-radius:2px;transition:background-image .2s}
.now-cap{display:flex;justify-content:space-between;gap:8px}
.now-cap b:empty{display:none}
.now-cap b{font-weight:500;text-transform:none;font-size:12px;letter-spacing:0}
.modes{display:flex;gap:6px;align-self:start}
.pill{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:7px 12px;background:var(--chip);cursor:pointer}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grain)}
.pill[aria-pressed="true"]::before{background:var(--accent)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hero-foot{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-title{font-family:var(--f-display);font-weight:500;font-stretch:100%;font-size:clamp(44px,8vw,112px);line-height:.86;letter-spacing:-.035em;margin:0}
.hero-title small{display:block;margin-top:14px}
.odo{text-align:right;display:grid;gap:4px}
.odo strong{font-family:var(--f-display);font-weight:700;font-stretch:62%;font-size:clamp(28px,4vw,48px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- 2. LAYERS ---------- */
#layers{height:320svh;border-top:1px solid var(--line)}
.layers-head{position:absolute;left:var(--gutter);right:var(--gutter);top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;justify-content:space-between;gap:20px;z-index:2;pointer-events:none}
.layers-head h2{font-family:var(--f-display);font-weight:800;font-stretch:62%;text-transform:uppercase;font-size:clamp(34px,6vw,76px);line-height:.9;margin:0;letter-spacing:-.01em;text-wrap:balance}
.layers-head p{max-width:34ch;margin:10px 0 0}
.pct{font-family:var(--f-display);font-weight:300;font-stretch:100%;font-size:clamp(56px,11vw,150px);line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--grain);text-align:right}
.pct .mono{display:block;letter-spacing:.04em;color:var(--ink);margin-top:10px}
.layer-stage{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 45%}
.layer{position:absolute;left:50%;top:58%;border-radius:4px;overflow:hidden;
  background:var(--glass);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);
  box-shadow:0 0 0 1px var(--line),0 20px 40px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;padding:10px;will-change:transform}
.layer .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.layer .ph+.l-top,.layer .ph~.l-bot{position:relative;color:#F2F0EB}
.layer.accent{background:var(--accent);color:var(--on-accent)}
.l-top{display:flex;justify-content:space-between;gap:6px}
.l-bot{display:grid;gap:4px}
.l-bot h3{margin:0;font-family:var(--f-display);font-weight:700;font-stretch:75%;font-size:clamp(14px,1.5vw,20px);line-height:1;text-transform:uppercase}
.l-bot .mono{font-size:10px;text-transform:none;letter-spacing:0;line-height:1.35}

/* ---------- 3. RIDES ---------- */
#rides{border-top:1px solid var(--line);padding-block:clamp(80px,10vw,120px) 40px;padding-inline:var(--gutter)}
.rides-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.rides-head h2{font-family:var(--f-display);font-weight:500;font-size:clamp(40px,7vw,96px);line-height:.86;letter-spacing:-.035em;margin:0}
.tag{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px}
.deck{position:relative;height:clamp(420px,62vw,680px);perspective:1600px;perspective-origin:50% 40%;overflow:hidden;margin-top:12px;outline:none}
.ride{position:absolute;left:50%;top:50%;padding:0;border:0;border-radius:2px;cursor:pointer;background-size:cover;background-position:center;
  transform-origin:50% 50%;transition:transform .9s cubic-bezier(.2,.75,.15,1),width .9s cubic-bezier(.2,.75,.15,1),height .9s cubic-bezier(.2,.75,.15,1),margin .9s cubic-bezier(.2,.75,.15,1),box-shadow .4s;box-shadow:0 0 0 .5px rgba(0,0,0,.3);backface-visibility:hidden}
.ride.sel{cursor:default;box-shadow:0 30px 60px -30px rgba(0,0,0,.55)}
.ride-meta{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:24px;align-items:start;border-top:1px solid var(--ink);padding-top:14px}
.ride-meta h3{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-stretch:80%;font-size:clamp(22px,2.6vw,32px);line-height:1;text-transform:uppercase;text-wrap:balance}
.sketches{grid-column:1/-1;grid-row:2;min-width:0;overflow:hidden;margin-top:6px}
.sketches svg{display:block;width:100%;fill:none;stroke:var(--ink);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.sketches svg .ghost{stroke:var(--grain);stroke-width:.8;opacity:.8}
.sketches svg .acc{stroke:var(--accent)}
.stats div{display:grid;gap:2px;min-width:0}
.stats strong{font-family:var(--f-display);font-weight:600;font-stretch:75%;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stepper{display:flex;gap:6px;grid-column:-2/-1;grid-row:1;justify-self:end}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);background:none;cursor:pointer;font-size:18px}
.stepper button:hover{background:var(--ink);color:var(--paper)}


@media (max-width:760px){
  .nav a:not(.keep){display:none}
  .layers-head{flex-direction:column;gap:6px}
  .pct{text-align:left;font-size:56px}
  .layers-head p{display:none}
  .ride-meta{grid-template-columns:1fr auto}
  .sketches{grid-row:2}
  .now{width:130px}
  .ring{top:44%}
  .hero-title{font-size:40px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ride{transition-duration:.01s}}

/* ---------- text helpers ---------- */
.ml{white-space:pre-line}
/* photo framing: --x/--y focus point, --z scale (set per photo in the editor) */
.im{position:absolute;inset:0;display:block;background-size:cover;background-repeat:no-repeat;
  background-position:var(--x,50%) var(--y,50%);transform:scale(var(--z,1));transform-origin:var(--x,50%) var(--y,50%);pointer-events:none}
.ring .card,.ride,.now-img{overflow:hidden;background-color:var(--chip)}
.now-img{position:relative}
.layer .ph{background-position:var(--x,50%) var(--y,50%);transform:scale(var(--z,1));transform-origin:var(--x,50%) var(--y,50%)}
.framer{display:grid;gap:6px;padding:8px 10px;border-radius:6px;background:var(--chip)}
.framer input[type=range]{width:100%;accent-color:var(--accent)}
.framer .fr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.framer output{font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- editor (writers only) ---------- */
.ed-fab{position:fixed;right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:60;border:0;border-radius:999px;
  padding:12px 18px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.ed{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:70;background:var(--paper);color:var(--ink);border-left:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:-30px 0 60px -40px rgba(0,0,0,.5);font-size:13px}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;border-bottom:1px solid var(--line)}
.ed-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:70%;text-transform:uppercase;font-size:20px}
.ed-body{flex:1;overflow:auto;padding:4px 18px 24px;overscroll-behavior:contain}
.ed-foot{border-top:1px solid var(--line);padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;gap:8px}
.ed-status{min-height:1.4em;color:var(--grain)}
.ed-status.err{color:var(--accent)}
.ed-actions{display:flex;gap:8px;justify-content:flex-end}
.ed details{border-bottom:1px solid var(--line);padding-block:12px}
.ed summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
.ed summary::after{content:"+";color:var(--grain)}
.ed details[open] summary::after{content:"–"}
.ed .fields{display:grid;gap:10px;margin-top:12px}
.ed label{display:grid;gap:4px;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--grain)}
.ed input[type=text],.ed textarea{width:100%;font:14px/1.4 var(--f-body);color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:6px;padding:8px 10px;text-transform:none;letter-spacing:0}
.ed textarea{resize:vertical;min-height:60px}
.ed input[type=text]:focus,.ed textarea:focus{outline:none;border-color:var(--ink)}
.ed .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ed .hint{margin:0;color:var(--grain);font-size:12px;line-height:1.45}
.btn{border:1px solid var(--ink);background:none;border-radius:999px;padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:5px 10px;font-size:10px}
.ib{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px;line-height:1;display:inline-grid;place-items:center;flex:none}
.ib:hover{border-color:var(--ink)}
.row-tools{display:flex;gap:4px;align-items:center}
.item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start;padding-block:10px;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.thumb{width:72px;aspect-ratio:3/2;border-radius:3px;background:var(--chip) center/cover no-repeat;border:0;padding:0;cursor:pointer;position:relative;overflow:hidden}
.thumb.tall{aspect-ratio:3/4}
.thumb span{position:absolute;inset:auto 0 0 0;background:rgba(11,11,11,.7);color:#F2F0EB;font-family:var(--f-mono);font-size:9px;text-transform:uppercase;padding:2px 0;text-align:center;opacity:0;transition:opacity .15s}
.thumb:hover span,.thumb:focus-visible span{opacity:1}
.item-fields{display:grid;gap:6px;min-width:0}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.check{display:flex!important;align-items:center;gap:6px;grid-template-columns:none!important}
.banner{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--chip);display:grid;gap:8px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--grain)}
.snd-row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.drop.over{border-color:var(--accent);color:var(--ink)}
body.editing .bar{right:min(440px,100vw)}
@media (max-width:760px){body.editing .bar{right:0}}

.gate{position:fixed;inset:0;z-index:80;border:0;margin:0;padding:0;background:rgba(11,11,11,.92);color:#F2F0EB;display:grid;place-content:center;gap:14px;text-align:center;cursor:pointer;transition:opacity .5s}
.gate-t{font-family:var(--f-display);font-weight:800;font-stretch:70%;text-transform:uppercase;font-size:clamp(44px,9vw,120px);line-height:.9;letter-spacing:-.01em}
.gate-s{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.gate.out{opacity:0;pointer-events:none}

/* ---------- 0. INTRO: spinning 3D MAXXIS wordmark, on the site's own paper and grain ---------- */
.intro{position:relative;height:100svh;min-height:480px;background:transparent;overflow:hidden}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.intro canvas:active{cursor:grabbing}
.intro-cue{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);color:var(--grain);letter-spacing:.14em;pointer-events:none}
.intro-cue::after{content:"";display:block;width:1px;height:28px;margin:8px auto 0;background:currentColor;opacity:.6}
.intro.nogl::before{content:"MAXXIS";position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(64px,16vw,220px)}
</style>

const BADGE_G={"TW": 1600, "TH": 340, "SH": 142, "X0": 0.92, "Y0": 0.1955, "SX0": 0.56, "SY0": 0.05};
(function(){
  const sec=document.getElementById('intro'),cv=document.getElementById('badge');if(!sec||!cv)return;
  let B=null;try{B=mountBadge(cv,BADGE_ATLAS,BADGE_G)}catch(e){console.error(e)}
  if(!B){sec.classList.add('nogl');return}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let vis=true,ang=-.35,vel=0,drag=null,last=performance.now();
  const size=()=>{const w=cv.clientWidth,h=cv.clientHeight,k=Math.min(devicePixelRatio||1,Math.sqrt(2.4e6/Math.max(1,w*h)));cv.width=Math.round(w*k);cv.height=Math.round(h*k)};
  size();addEventListener('resize',size);
  new IntersectionObserver(es=>{vis=es[0].isIntersecting},{threshold:0}).observe(sec);
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.x=e.clientX;ang+=dx*.008;vel=dx*.008});
  const up=()=>{drag=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  function loop(now){const dt=Math.min(64,now-last)/1000;last=now;
    if(vis){if(!drag&&!reduce){ang+=dt*Math.PI*2/8+vel;vel*=.92}B.render(ang,now/1000,{grain:.05,focal:1.75})}
    requestAnimationFrame(loop)}
  B.loaded.then(()=>requestAnimationFrame(loop));
})();


/* grain overlay */
(function(){const c=$('#grain'),s=180;c.width=s;c.height=s;const ctx=c.getContext('2d'),d=ctx.createImageData(s,s);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}ctx.putImageData(d,0,0);
  const url=c.toDataURL();c.style.background=`url(${url})`;c.width=1;c.height=1;c.style.width='100%';c.style.height='100%'})();

  document.title = C.site.title || C.site.name;
}

/* ---------- wheel sound: low ambient drone that opens up as the wheel spins, plus a deep thump when a photo lands (Web Audio, no files) ---------- */
const SOUNDS={
  space:{name:'Deep space',desc:'Wide, slow drone with a soft echoing pulse',
    osc:[['sawtooth',55,-7,.32],['sawtooth',55,7,.32],['triangle',82.4,0,.22],['sine',27.5,0,.5]],
    noise:0,nf:300,cut:[160,1100],q:3,lfo:[.07,90],idle:.35,delay:[.42,.42],
    thump:{f:[120,46],dur:.9,v:.9,click:.12,cf:700,beats:[0]}},
  engine:{name:'Engine room',desc:'Grinding machine hum that throbs faster as it spins',
    osc:[['sawtooth',41.2,0,.4],['square',61.7,-4,.14],['sawtooth',82.4,5,.18]],
    noise:.6,nf:140,cut:[120,900],q:6,lfo:[.15,60],idle:.65,delay:[.18,.2],throb:[2,9],
    thump:{f:[150,55],dur:.45,v:.85,click:.35,cf:1400,beats:[0]}},
  heart:{name:'Heartbeat',desc:'Barely-there hum; each photo lands with a lub-dub',
    osc:[['sine',49,0,.55],['triangle',98,3,.18],['sine',147,0,.06]],
    noise:.08,nf:200,cut:[140,600],q:2,lfo:[.05,40],idle:.3,delay:[.3,.18],
    thump:{f:[90,44],dur:.35,v:1,click:.08,cf:500,beats:[0,.26]}},
};
const soundKey=()=>SOUNDS[C.site.sound]?C.site.sound:'space';
const soundVol=()=>{const v=+C.site.soundVol;return isFinite(v)&&C.site.soundVol!==undefined?Math.min(1,Math.max(0,v)):.7};
let snd=null,soundOn=false,spd=0,droneKey=null,previewT=0;
function makeSound(){return null; /* sound removed from the site */
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  const ctx=new AC(),sr=ctx.sampleRate,buf=ctx.createBuffer(1,sr*2,sr),d=buf.getChannelData(0);
  let b=0;for(let i=0;i<d.length;i++){b=(b+.02*(Math.random()*2-1))/1.02;d[i]=b*3.5}   /* brown noise */
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(ctx.destination);
  const master=ctx.createGain();master.gain.value=0;master.connect(comp);
  /* soft saturation adds upper harmonics so the bass still reads on laptop / TV speakers */
  const sat=ctx.createWaveShaper(),cv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cv[i]=Math.tanh(x*2.2)}sat.curve=cv;
  const satG=ctx.createGain();satG.gain.value=.35;sat.connect(satG);satG.connect(master);
  const dl=ctx.createDelay(1),fb=ctx.createGain(),dlf=ctx.createBiquadFilter();dlf.type='lowpass';dlf.frequency.value=900;
  dl.connect(dlf);dlf.connect(fb);fb.connect(dl);dlf.connect(master);
  return {ctx,buf,master,sat,dl,fb,drone:null};
}
function startDrone(key){
  const s=snd,c=s.ctx,P=SOUNDS[key],t=c.currentTime;stopDrone();
  const out=c.createGain();out.gain.value=0;out.gain.setTargetAtTime(1,t,.8);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=P.cut[0];lp.Q.value=P.q;
  const lvl=c.createGain();lvl.gain.value=P.idle;
  lp.connect(lvl);lvl.connect(out);out.connect(s.master);out.connect(s.sat);
  s.dl.delayTime.value=P.delay[0];s.fb.gain.value=P.delay[1];
  const nodes=[];
  P.osc.forEach(([type,f,det,v])=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;const g=c.createGain();g.gain.value=v;o.connect(g);g.connect(lp);o.start();nodes.push(o)});
  if(P.noise){const n=c.createBufferSource();n.buffer=s.buf;n.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=P.nf;bp.Q.value=1.2;const g=c.createGain();g.gain.value=P.noise;n.connect(bp);bp.connect(g);g.connect(lp);n.start();nodes.push(n)}
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=P.lfo[0];lg.gain.value=P.lfo[1];lfo.connect(lg);lg.connect(lp.frequency);lfo.start();nodes.push(lfo);
  let tr=null;if(P.throb){tr=c.createOscillator();const tg=c.createGain();tr.frequency.value=P.throb[0];tg.gain.value=.35;tr.connect(tg);tg.connect(lvl.gain);tr.start();nodes.push(tr)}
  s.drone={out,lp,lvl,nodes,tr,P};droneKey=key;
}
function stopDrone(){const s=snd;if(!s||!s.drone)return;const {out,nodes}=s.drone,t=s.ctx.currentTime;
  out.gain.cancelScheduledValues(t);out.gain.setTargetAtTime(0,t,.25);nodes.forEach(n=>{try{n.stop(t+1.5)}catch(e){}});s.drone=null;droneKey=null}
function ensureSound(){if(!snd)snd=makeSound();if(!snd)return null;if(snd.ctx.state==='suspended')snd.ctx.resume();
  if(droneKey!==soundKey())startDrone(soundKey());snd.master.gain.setTargetAtTime(soundVol(),snd.ctx.currentTime,.4);return snd}
/* the drone brightens and swells with wheel speed, then settles */
function shape(e){const s=snd;if(!s||!s.drone)return;const {lp,lvl,tr,P}=s.drone,t=s.ctx.currentTime;
  lp.frequency.setTargetAtTime(P.cut[0]+(P.cut[1]-P.cut[0])*e,t,.15);
  if(!P.throb)lvl.gain.setTargetAtTime(P.idle+(1-P.idle)*e,t,.2);else{lvl.gain.setTargetAtTime(P.idle+.4*e,t,.2);tr.frequency.setTargetAtTime(P.throb[0]+(P.throb[1]-P.throb[0])*e,t,.3)}}
function soundStep(dRot){
  if(!snd||!snd.drone||(!soundOn&&!previewT))return;
  spd+=(Math.min(1,Math.abs(dRot)/6)-spd)*.08;shape(spd);
}
/* a deep pitch-dropping thump (with a little click so small speakers carry it) */
function thump(at){
  const s=snd,c=s.ctx,P=SOUNDS[soundKey()].thump,t0=at||c.currentTime;
  P.beats.forEach((off,k)=>{const t=t0+off,v=P.v*(k?.7:1);
    const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(P.f[0],t);o.frequency.exponentialRampToValueAtTime(P.f[1],t+.12);
    const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+P.dur);
    o.connect(g);g.connect(s.master);g.connect(s.sat);g.connect(s.dl);o.start(t);o.stop(t+P.dur+.05);
    if(P.click){const n=c.createBufferSource();n.buffer=s.buf;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=P.cf;bp.Q.value=1.5;
      const ng=c.createGain();ng.gain.setValueAtTime(P.click*6,t);ng.gain.exponentialRampToValueAtTime(.0005,t+.06);n.connect(bp);bp.connect(ng);ng.connect(s.master);n.start(t,Math.random(),.08)}});
}
let lastThump=0;

/* a short spin-up and settle so a style can be heard before choosing it */
function previewSound(key){
  const was=C.site.sound;C.site.sound=key;if(!ensureSound()){C.site.sound=was;return}
  if(droneKey!==key)startDrone(key);
  clearTimeout(previewT);previewT=1;let k=0;const tm=setInterval(()=>{k++;const e=k<25?k/25:Math.max(0,1-(k-25)/40);shape(e);if(k===30)thump();if(k>=70)clearInterval(tm)},50);
  previewT=setTimeout(()=>{previewT=0;shape(0);if(!soundOn){snd.master.gain.setTargetAtTime(0,snd.ctx.currentTime,.3);setTimeout(()=>{if(!soundOn&&!previewT)snd.ctx.suspend()},1500)}},4800);
}

/* ---------- hand-drawn street scene under the ride log: a sketched wheel rolling along a road ---------- */
function sk(seed){
  const r=mulberry(seed),j=a=>(r()-.5)*a;
  const line=(pts,amp=1.2)=>{let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+(p[0]+j(amp)).toFixed(1)+' '+(p[1]+j(amp)).toFixed(1)});return d};
  const circ=(cx,cy,R,amp=1.2,turns=1.08)=>{const pts=[],n=48,a0=r()*6.28;for(let i=0;i<=n*turns;i++){const a=a0+i/n*6.283,rr=R+j(amp);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}return line(pts,.3)};
  return {line,circ,j,r};
}
/* a wheel centred on 0,0 so it can be rotated in place */
function wheelPaths(S,R,spokes){
  let d=S.circ(0,0,R,1.2)+S.circ(0,0,R*.9,1.4,1);
  for(let i=0;i<spokes;i++){const a=i/spokes*6.283;d+=S.line([[Math.cos(a)*R*.12,Math.sin(a)*R*.12],[Math.cos(a+.4)*R*.86,Math.sin(a+.4)*R*.86]],.4)}
  for(let i=0;i<24;i++){const a=i/24*6.283;d+=S.line([[Math.cos(a)*R,Math.sin(a)*R],[Math.cos(a)*R*1.1,Math.sin(a)*R*1.1]],.3)}
  return d+S.circ(0,0,R*.1,.3);
}
let street=null;
function drawSketches(){
  const host=document.getElementById('sketches');if(!host||street)return;
  const S=sk(7),H=120,G=104,R=24;
  // bike frame relative to the rear hub at 0,0 ; front hub at 104,0
  const frame=S.line([[0,0],[44,2],[32,-36],[0,0]])+S.line([[44,2],[88,-32],[32,-36]])+S.line([[88,-32],[93,-42],[104,0]])
    +S.line([[93,-42],[84,-46],[102,-48]])+S.line([[32,-36],[29,-46]])+S.line([[20,-47],[40,-48]],.8);
  const crank=S.line([[44,2],[52,6],[38,8]],.6);
  host.innerHTML=`<svg id="streetSvg" height="${H}" role="presentation">
    <g id="road"></g>
    <g id="loose"><path class="whl" d="${wheelPaths(sk(11),R,16)}"/></g>
<g id="bike" style="display:none"><g class="rw"></g><g class="fw"></g><path id="speed" d=""/></g>
  </svg>`;
  const svg=host.querySelector('svg'),road=svg.querySelector('#road'),bike=svg.querySelector('#bike'),loose=svg.querySelector('#loose'),
        rw=bike.querySelector('.rw'),fw=bike.querySelector('.fw'),speed=svg.querySelector('#speed');
  let W=0;
  function layout(){W=host.clientWidth||600;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);
    const RS=sk(21);let d=RS.line([[0,G],[W*.25,G],[W*.5,G],[W*.75,G],[W,G]],1.1)+RS.line([[0,G+2.5],[W,G+2.5]],.8);
    let dash='';for(let x=10;x<W;x+=46)dash+=RS.line([[x,G+11],[x+22,G+11]],.6);
    let grit='';for(let i=0;i<W/18;i++){const x=RS.r()*W;grit+=RS.line([[x,G+5+RS.r()*3],[x+2+RS.r()*4,G+5+RS.r()*3]],.3)}
    road.innerHTML=`<path d="${d}"/><path class="ghost" d="${dash}"/><path class="ghost" d="${grit}"/>`}
  layout();addEventListener('resize',layout);
  const span=()=>W+260;let x=0,last=performance.now(),visible=true;
  new IntersectionObserver(es=>{visible=es[0].isIntersecting}).observe(host);
  function place(t){
    const v=reduce?0:70;                       // px per second
    const bx=((x)%span())-180, lx=((x+W*.3)%span())-60;
    const bob=Math.sin(t/90)*.5, rot=x/R*57.3;
    bike.setAttribute('transform',`translate(${bx.toFixed(1)} ${(G-R+bob).toFixed(1)})`);
    rw.setAttribute('transform',`rotate(${rot.toFixed(1)})`);fw.setAttribute('transform',`translate(104 0) rotate(${rot.toFixed(1)})`);
    loose.setAttribute('transform',`translate(${lx.toFixed(1)} ${G-R}) rotate(${(rot*1.02).toFixed(1)})`);
    let sl='';for(let k=0;k<3;k++){const yy=-30+k*12;sl+=`M${-14-k*6} ${yy}L${-34-k*10} ${yy}`}speed.setAttribute('d',sl);
    return v}
  function step(now){const dt=Math.min(60,now-last);last=now;if(visible){const v=place(now);x+=v*dt/1000}requestAnimationFrame(step)}
  place(0);requestAnimationFrame(step);
  street=true;
}

function boot(){
/* ============ 1. WHEEL ============ */
const N=60, STEP=360/N, FAN=72;
const ring=$('#ring'),stage=$('#wheelStage');let cards=[];
const placeholderPool=[];for(let i=0;i<21;i++){const k=KIND_ORDER[i%KIND_ORDER.length];placeholderPool.push({ph:[k,101+i*7],cap:CAPS[k][(i/7|0)%CAPS[k].length]})}
function buildWheel(){
  ring.innerHTML='';cards=[];
  const own=C.wheel.filter(w=>w.img);const list=own.length?own:placeholderPool;
  for(let i=0;i<N;i++){const p=own.length?list[i%list.length]:list[(i*8)%list.length];
    const url=p.img?src(p.img):make(p.ph[0],240,320,p.ph[1]);
    const el=document.createElement('div');el.className='card';el.appendChild(imEl(url,p.img?p:null));ring.appendChild(el);cards.push({el,url,cap:p.cap||'',fr:p.img?p:null,pi:own.length?i%list.length:((i*8)%list.length),pn:list.length})}
  layoutRing();lastIdx=-1}
let R=300;
function layoutRing(){const W=stage.clientWidth,H=stage.clientHeight;R=clamp(Math.min(W*.33,H*.4),130,400);const cw=R*.27,ch=cw*1.36;
  cards.forEach((c,i)=>{c.el.style.width=cw+'px';c.el.style.height=ch+'px';c.el.style.left=-cw/2+'px';c.el.style.top=-ch/2+'px';
    c.el.style.transform=`rotateY(${i*STEP}deg) translateZ(${R}px) rotateY(${FAN}deg)`})}
let rot=0,target=0,mode='scroll',lastY=scrollY,odo=0,lastIdx=-1,dragging=false,dx0=0;
const nowImg=$('#nowImg'),nowCap=$('#nowCap'),nowIdx=$('#nowIdx'),odoEl=$('#odo');
function setMode(m){mode=m;$('#mScroll').setAttribute('aria-pressed',m==='scroll');$('#mAnim').setAttribute('aria-pressed',m==='anim')}
$('#mScroll').onclick=()=>setMode('scroll');$('#mAnim').onclick=()=>setMode('anim');
addEventListener('scroll',()=>{const y=scrollY;if(mode==='scroll')target-=(y-lastY)*.16;lastY=y},{passive:true});
stage.addEventListener('pointerdown',e=>{dragging=true;dx0=e.clientX;stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dragging)return;target+=(e.clientX-dx0)*.35;dx0=e.clientX});
const end=()=>{dragging=false;stage.classList.remove('drag')};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);

/* ============ 2. LAYERS ============ */
const lstage=$('#layerStage');let lcards=[];let lp=-1;
function buildLayers(){
  lstage.innerHTML='';
  lcards=C.layers.items.map((L,i,arr)=>{const el=document.createElement('article');el.className='layer'+(L.accent?' accent':'');
    const url=L.img?src(L.img):(L.ph?make(L.ph,300,400,L.seed):null);
    el.innerHTML=(url?`<div class="ph" style="background-image:url(&quot;${esc(url)}&quot;);--x:${(L.img&&L.x!=null)?L.x:50}%;--y:${(L.img&&L.y!=null)?L.y:50}%;--z:${(L.img&&L.z)||1}"></div>`:'')+
    `<div class="l-top mono"><span>L${String(i+1).padStart(2,'0')}</span><span>${i===0?'outer':i===arr.length-1?'inner':''}</span></div><div class="l-bot"><h3>${esc(L.t)}</h3><span class="mono">${esc(L.s)}</span></div>`;
    lstage.appendChild(el);return el});

}
const pctEl=$('#pct');
function layoutLayers(p){const W=lstage.clientWidth,H=lstage.clientHeight;const n=lcards.length;if(!n)return;const cols=Math.min(n,W<760?4:7),rows=Math.ceil(n/cols);
  const gap=W<760?8:14;const cw=Math.min(190,(W-32-gap*(cols-1))/cols,(H*.42)/rows/1.33);const ch=cw*1.33;
  lcards.forEach((el,i)=>{el.style.width=cw+'px';el.style.height=ch+'px';el.style.marginLeft=-cw/2+'px';el.style.marginTop=-ch/2+'px';
    const q=ease(clamp(p*1.35-i*.05,0,1));
    const row=Math.floor(i/cols),inRow=row<rows-1?cols:n-cols*(rows-1),col=i-row*cols;
    const fx=(col-(inRow-1)/2)*(cw+gap),fy=(row-(rows-1)/2)*(ch+gap)+H*.02;

    const x=ex+(fx-ex)*q,y=ey+(fy-ey)*q,z=ez*(1-q),ry=-48*(1-q),rx=6*(1-q),sc=(1.35*s)+(1-1.35*s)*q;
    el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${sc})`;
    el.style.zIndex=q>.5?10:n-i});
  pctEl.textContent=Math.round(p*100)}

/* ============ 3. RIDES ============ */
const deck=$('#deck');let rides=[],sel=-1,hover=-1;
function buildRides(){
  const items=C.rides.items;deck.innerHTML='';
  if(sel<0){const own=items.findIndex(d=>d.img);sel=own>=0?own:Math.floor(items.length*.4)}sel=clamp(sel,0,Math.max(0,items.length-1));

function layoutDeck(){const W=deck.clientWidth,H=deck.clientHeight;const cw=clamp(W*.17,96,190),ch=cw*2/3;const selW=Math.min(W*(W<760?.74:.5),620,H*.62*1.5);const S=selW/cw;
  rides.forEach((el,i)=>{const w=i===sel?selW:cw,h=i===sel?selW*2/3:ch;el.style.width=w+'px';el.style.height=h+'px';el.style.marginLeft=-w/2+'px';el.style.marginTop=-h/2+'px';
    let t,k;

    else{const a=i<sel;k=a?sel-1-i:i-sel-1;const dir=a?-1:1;const lift=i===hover?-14:0;
      const x=dir*(W*(W<760?.36:.33)+k*cw*.11),y=-dir*(H*.3+k*cw*.06)+lift,z=-k*5-40;

    el.style.zIndex=i===sel?100:50-k})}
function meta(){const items=C.rides.items;const d=items[sel]||{};$('#rNo').textContent=items.length?`${String(sel+1).padStart(2,'0')} / ${items.length}`:'No rides yet';
  $('#rName').textContent=d.name||'';drawSketches()}
const step=d=>{const n=C.rides.items.length;if(!n)return;sel=(sel+d+n)%n;layoutDeck();meta()};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
deck.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){step(-1);e.preventDefault()}if(e.key==='ArrowRight'){step(1);e.preventDefault()}});

/* ============ LOOP ============ */
const layersSec=$('#layers');let last=performance.now();
function frame(now){const dt=Math.min(64,now-last);last=now;
  if(mode==='anim'&&!dragging&&!reduce)target-=dt*.014;
  const prev=rot;rot+=(target-rot)*(reduce?.3:.08);odo+=Math.abs(rot-prev)/360*2.33;soundStep(rot-prev);
  ring.style.transform=`rotateX(-16deg) rotateY(${rot}deg)`;

    if(idx!==lastIdx){if(lastIdx>=0)soundLand();lastIdx=idx;const p=cards[idx];nowImg.replaceChildren(imEl(p.url,p.fr));nowCap.textContent=p.cap;const pad=n=>String(n).padStart(2,'0');nowIdx.textContent=`${pad(p.pi+1)}/${pad(p.pn)}`;odoEl.textContent=`${pad(p.pi+1)} / ${pad(p.pn)}`}}

  if(r.top<innerHeight&&r.bottom>0){const p=clamp(-r.top/(r.height-innerHeight),0,1);if(Math.abs(p-lp)>.0005){lp=p;layoutLayers(p)}}
  requestAnimationFrame(frame)}
renderText();buildWheel();buildLayers();layoutLayers(0);buildRides();
addEventListener('resize',()=>{layoutRing();lp=-1;layoutDeck()});
requestAnimationFrame(frame);

return { focusRide(i){sel=i;layoutDeck();meta();document.getElementById('rides').scrollIntoView({behavior:reduce?'auto':'smooth'})}, refresh(part){renderText();if(!part||part==='wheel')buildWheel();if(!part||part==='layers')buildLayers();if(!part||part==='rides')buildRides()} };
}

function idb(mode,fn){return new Promise((res)=>{try{const r=indexedDB.open('rollout',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{try{const tx=r.result.transaction('kv',mode);const q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}})}

function readDraft(){ return draftCache }
function clearDraft(){ draftCache=null; idb('readwrite',st=>st.delete(DRAFT_KEY)); try{localStorage.removeItem(DRAFT_KEY)}catch(e){} }

      ${L.length<8?`<button class="btn sm" data-act="layer-add">Add card</button>`:''}
    </div></details>

    <details><summary>Ride log (${Rr.length})</summary><div class="fields">
      ${field('Heading','rides.title')}
      ${field('Small tag','rides.tag')}
      <div class="drop" data-drop="rides">Drop photos to add rides, or <button class="btn sm" data-act="ride-add">Add ride</button></div>
      <div>${Rr.map((r,i)=>`<div class="item">
        ${thumb(r.img,null,'ride-photo:'+i,false,r)}
        <div class="item-fields"><div class="item-top"><span class="mono muted">Ride ${i+1}</span><span class="row-tools">
          <button class="ib" data-act="ride-up:${i}" aria-label="Move up">↑</button><button class="ib" data-act="ride-down:${i}" aria-label="Move down">↓</button><button class="ib" data-act="ride-del:${i}" aria-label="Remove">✕</button></span></div>
          ${field('Name','rides.items.'+i+'.name')}
          ${framer('rides.items.'+i,r)}</div></div>`).join('')}</div>
    </div></details>

  </div>
  <div class="ed-foot">
    <div class="ed-status mono" role="status"></div>
    <div class="ed-actions"><button class="btn" data-act="discard">Discard</button><button class="btn primary" data-act="publish">Publish changes</button></div>
  </div>
  <input type="file" id="edFile" accept="image/*" hidden>`;
}

function openEditor(){
  if(!ed){ ed=document.createElement('aside'); ed.className='ed'; ed.setAttribute('aria-label','Page editor'); document.body.appendChild(ed); wireEditor() }
  ed.hidden=false; document.body.classList.add('editing'); $('#edFab').hidden=true; redrawEditor();
}
function redrawEditor(){
  const body=ed.querySelector('.ed-body'); const top=body?body.scrollTop:0;
  const open=[...ed.querySelectorAll('details')].map(d=>d.open);
  ed.innerHTML=editorHTML();
  ed.querySelectorAll('details').forEach((d,i)=>{if(open.length)d.open=open[i]});
  ed.querySelector('.ed-body').scrollTop=top;
  setStatus(busy?'Working…':(dirty?'Unpublished changes':'Everything is published')+sizeNote()); updateButtons();
}

/* resize a photo before upload: keeps the page fast */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};im.src=u})}
async function shrink(file,maxEdge){
  const im=await loadImg(file);const k=Math.min(1,maxEdge/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  const g2=c.getContext('2d');g2.imageSmoothingQuality='high';g2.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);
  return c.toDataURL('image/jpeg',.82);
}
const ERR={too_large:'That photo is too large even after resizing.',unsupported_type:'That file type isn’t supported. Use JPG or PNG.',quota_or_state:'The page’s photo storage is full.',rate_limited:'Uploading too fast. Wait a moment and try again.',not_granted:'This view can’t upload photos.',upstream_auth:'Your session expired. Reload the page and sign in again.'};
async function uploadFiles(files,maxEdge){
  const ids=[];let failed=0,lastErr='';
  for(let i=0;i<files.length;i++){
    setStatus(`Adding ${i+1} of ${files.length}…`);
    try{
      const data=await shrink(files[i],maxEdge);
      ids.push({id:data,name:files[i].name});
    }catch(e){failed++;lastErr=e&&e.message==='decode'?'Couldn’t read one of the photos. Export HEIC or RAW files as JPG first.':(ERR[e&&e.code]||'One upload failed. Try again.')}
  }
  if(failed) setStatus(`${ids.length} uploaded, ${failed} failed. ${lastErr}`,true);
  return ids;
}
const baseName = n => n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();

function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}

async function withFiles(target, files){
  if(!files||!files.length)return;
  busy=true;updateButtons();
  const [kind,idx]=target.split(':');const i=+idx;
  if(kind==='wheel-add'){const up=await uploadFiles([...files],1200);up.forEach(u=>C.wheel.push({img:u.id,cap:''}));busy=false;changed('wheel')}
  else if(kind==='wheel-replace'){const up=await uploadFiles([files[0]],1200);if(up[0])C.wheel[i].img=up[0].id;busy=false;changed('wheel')}
  else if(kind==='layer-photo'){const up=await uploadFiles([files[0]],1200);if(up[0])C.layers.items[i].img=up[0].id;busy=false;changed('layers')}
  else if(kind==='ride-photo'){const up=await uploadFiles([files[0]],1600);if(up[0])C.rides.items[i].img=up[0].id;busy=false;changed('rides');if(up[0])site.focusRide(i)}
  else if(kind==='ride-add'){const up=await uploadFiles([...files],1600);const first=C.rides.items.length;up.forEach(u=>C.rides.items.push({name:baseName(u.name),km:'',el:'',set:'',geo:'',img:u.id,ph:'dusk'}));busy=false;changed('rides');if(up.length)site.focusRide(first)}
  busy=false;redrawEditor();
}

function pageHTML(){
  const json=JSON.stringify(C,null,1).replace(/</g,'\\u003c');
  const S='<'+'script', E='</'+'script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n'
   + '<title>'+esc(C.site.title||C.site.name)+'</title>\n'
   + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">\n'
   + '<style id="site-css">'+CSS_SRC+'</style>\n<div id="app"></div>\n'
   + S+' type="application/json" id="site-data">'+json+E+'\n'
   + S+' id="site-js">'+JS_SRC+E+'\n</body></html>';
}
function photoHolders(){return [...C.wheel,...C.layers.items,...C.rides.items].filter(h=>h&&h.img)}
function dataToBlob(d){const b64=d.slice(d.indexOf(',')+1),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'image/jpeg'})}
async function hashOf(str){try{const h=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(str));return [...new Uint8Array(h)].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}}
/* move new (data:) photos out of the page into their own files */
async function externalize(){const files={};
  for(const h of photoHolders()){ if(!isData(h.img)) continue;
    const path='img/'+await hashOf(h.img)+'.jpg';
    if(!files[path]){const blob=dataToBlob(h.img);files[path]=blob;urlFor[path]=URL.createObjectURL(blob)}
    h.img=path }
  return files}
function failMsg(c){
  if(c==='conflict') return 'A newer version was saved elsewhere. The page will reload; your edits are kept in this browser and you can restore them.';
  if(c==='not_writer'||c==='not_granted'||c==='consent_required') return 'This view is read-only, so changes can’t be published here.';
  if(c==='rate_limited') return 'Publishing too often. Wait a minute, then try again.';
  if(c==='too_large') return 'The page is too large to save. Remove a few photos, then publish again.';
  return 'Couldn’t publish. Check your connection and try again.'}
async function publish(){
  if(busy||!dirty)return; busy=true;updateButtons();setStatus('Publishing…');
  saveDraft();
  const html=pageHTML();
  if(html.length>15.5e6){busy=false;updateButtons();setStatus(`The page is ${(html.length/1e6).toFixed(1)} MB; the limit is 15 MB. Remove a few photos, then publish again.`,true);return}
  try{ await art.publish(html); setStatus('Published. Reloading…') }
  catch(e){busy=false;updateButtons();setStatus(failMsg(e&&e.code),true)}
}

function wireEditor(){
  ed.addEventListener('input',e=>{
    if(e.target.dataset.svol){C.site.soundVol=+e.target.value/100;const o=ed.querySelector('[data-out="svol"]');if(o)o.textContent=e.target.value+'%';if(snd&&(soundOn||previewT))snd.master.gain.setTargetAtTime(soundVol(),snd.ctx.currentTime,.1);changedSoon('text');return}
    const rp=e.target.dataset.range;
    if(rp){const v=+e.target.value/(+e.target.dataset.div||1);setP(C,rp,v);
      const base=rp.slice(0,rp.lastIndexOf('.')),o=getP(C,base);
      const out=ed.querySelector(`[data-out="${base}.z"]`);if(out)out.textContent=Math.round((o.z??1)*100)+'%';
      const th=e.target.closest('.item')?.querySelector('.thumb .im');if(th)applyFrame(th,o);
      changedSoon(base.startsWith('wheel')?'wheel':base.startsWith('layers')?'layers':'rides');return}
    const p=e.target.dataset.path;if(!p)return;setP(C,p,e.target.value);
    changedSoon(p.startsWith('wheel')?'wheel':p.startsWith('layers.items')?'layers':p.startsWith('rides.items')?'rides':'text')});
  ed.addEventListener('change',e=>{
    const ck=e.target.dataset.check;if(ck){setP(C,ck,e.target.checked);changed('layers');return}
    if(e.target.dataset.sgate){C.site.soundGate=e.target.checked;changed('text');return}
    if(e.target.dataset.sound){C.site.sound=e.target.dataset.sound;changed('text');previewSound(C.site.sound);return}
    if(e.target.id==='edFile'){const t=e.target.dataset.target;const f=e.target.files;withFiles(t,f);e.target.value=''}
  });
  ed.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b||!ed.contains(b))return;
    const [act,idx]=b.dataset.act.split(':');const i=+idx;const fi=ed.querySelector('#edFile');
    const pick=(target,multi)=>{if(busy)return;fi.dataset.target=target;fi.multiple=!!multi;fi.click()};
    switch(act){
      case 'close': ed.hidden=true;document.body.classList.remove('editing');$('#edFab').hidden=false;return;
      case 'publish': publish();return;
      case 'discard': C=JSON.parse(PUBLISHED);clearDraft();changed();redrawEditor();return;
      case 'restore': try{C=JSON.parse(readDraft())}catch(_){};changed();redrawEditor();return;
      case 'dropdraft': clearDraft();redrawEditor();return;
      case 'reset-frame': {const o=getP(C,idx);if(o){delete o.x;delete o.y;delete o.z}changed(idx.startsWith('wheel')?'wheel':idx.startsWith('layers')?'layers':'rides');redrawEditor();return}
      case 'snd-play': previewSound(idx);return;
      case 'wheel-add': pick('wheel-add',true);return;
      case 'wheel-replace': pick('wheel-replace:'+i);return;
      case 'wheel-up': move(C.wheel,i,-1);break;
      case 'wheel-down': move(C.wheel,i,1);break;
      case 'wheel-del': C.wheel.splice(i,1);break;
      case 'layer-photo': pick('layer-photo:'+i);return;
      case 'layer-clear': C.layers.items[i].img=null;C.layers.items[i].ph=null;break;
      case 'layer-up': move(C.layers.items,i,-1);break;
      case 'layer-down': move(C.layers.items,i,1);break;
      case 'layer-del': C.layers.items.splice(i,1);break;
      case 'layer-add': C.layers.items.push({t:'New layer',s:'Detail',img:null,ph:null,seed:0,accent:false});break;
      case 'ride-add': C.rides.items.push({name:'New ride',km:'',el:'',set:'',geo:'',img:null,ph:'dusk'});break;
      case 'ride-photo': pick('ride-photo:'+i);return;
      case 'ride-up': move(C.rides.items,i,-1);break;
      case 'ride-down': move(C.rides.items,i,1);break;
      case 'ride-del': C.rides.items.splice(i,1);break;
      default: return;
    }
    changed(act.split('-')[0]==='wheel'?'wheel':act.split('-')[0]==='layer'?'layers':'rides');redrawEditor();
  });
  ed.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.add('over')});
  ed.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
  ed.addEventListener('drop',e=>{const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.remove('over');
    const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(!files.length||busy)return;
    withFiles(d.dataset.drop==='wheel'?'wheel-add':'ride-add',files)});
}

async function initEditor(){
  if(!window.claude||!window.claude.use)return;
  try{ art=await window.claude.use('artifact') }catch(e){return}
  if(!art)return;
  await loadDraft(); if(readDraft()===PUBLISHED)clearDraft();
  const fab=document.createElement('button');fab.className='ed-fab';fab.id='edFab';fab.textContent='Edit page';fab.onclick=openEditor;document.body.appendChild(fab);
}

/* load photo files through fetch and hand the page blob: URLs (works in every viewer frame) */
async function preloadPhotos(){
  const paths=[...new Set(photoHolders().map(h=>h.img).filter(p=>p&&!isData(p)&&!urlFor[p]))];
  if(!paths.length)return false;
  await Promise.all(paths.map(async p=>{
    for(const u of [p,new URL(p,document.baseURI).href]){
      try{const r=await fetch(u);if(!r.ok)continue;const b=await r.blob();if(!b.size)continue;urlFor[p]=URL.createObjectURL(b);return}catch(e){}
    }}));
  return true;
}
const go=()=>{try{site=boot();preloadPhotos().then(ok=>{if(ok)site.refresh()});soundGate();initEditor()}catch(e){console.error(e)}};
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(()=>{
  Promise.all([document.fonts.load('900 40px Archivo'),document.fonts.load('500 12px "IBM Plex Mono"')].map(p=>p.catch(()=>{}))).finally(go)});
})();
</script>
